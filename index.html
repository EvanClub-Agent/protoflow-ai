<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="protoflow-app" content="alex-protoflow-ai" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the persisted theme & locale before first paint to avoid flash.
      try {
        var pref = localStorage.getItem("color-scheme") || "light";
        var resolved =
          pref === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : pref === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = resolved;
        document.querySelector('meta[name="color-scheme"]').content = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
      try {
        var savedLoc = localStorage.getItem("protoflow-locale");
        var rawLang = savedLoc || ((navigator.languages && navigator.languages[0]) || navigator.language || "zh-CN");
        var isZh = /^zh\b/i.test(rawLang) || String(rawLang).toLowerCase().indexOf("zh") === 0;
        var loc = isZh ? "zh-CN" : "en-US";
        document.documentElement.lang = loc === "en-US" ? "en" : "zh-CN";
        if (savedLoc) {
          document.documentElement.dataset.locale = loc;
        }
        if (loc === "en-US") {
          document.title = "Alex — AI Interactive Prototype & Data Flow Workbench";
        }
      } catch (e) {}
    </script>
    <title>Alex — AI 时代可运行原型与数据流转沙盒</title>
  </head>
  <body class="antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
