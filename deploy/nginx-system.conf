# System Nginx LAN deployment example.
limit_req_zone $binary_remote_addr zone=protoflow_preview:10m rate=5r/s;
server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    root /data/protoflow-ai/current/viewer;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    # Match the HTML nonce to this response's CSP, including sandboxed srcdoc.
    sub_filter '__PROTOFLOW_FRAME_NONCE__' $request_id;
    location /api/v1/view/ {
        limit_req zone=protoflow_preview burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location /api/v1/mcp/ {
        limit_req zone=protoflow_preview burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
    location = /api/v1/updates {
        limit_req zone=protoflow_preview burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/updates/ {
        limit_req zone=protoflow_preview burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/admin/ {
        # LAN admin access also requires matching ADMIN_HTTP_ALLOWED_CIDRS in the API.
        # Keep this allowlist aligned with the configured server LAN.
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=protoflow_preview burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 35s;
    }
    location = /api/v1/releases {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 300s;
    }
    location /api/v1/releases/ {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 35s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8081; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /p/ { expires -1; try_files /viewer.html =404; }
    location /releases { expires -1; try_files /viewer.html =404; }
    location /updates { expires -1; try_files /viewer.html =404; }
    location = / { try_files /viewer.html =404; }
    location / { try_files $uri =404; }
}
