limit_req_zone $binary_remote_addr zone=preview_access:10m rate=5r/s;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream protoflow_api {
    zone protoflow_api 64k;
    server api:8081 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    # Match the HTML nonce to this response's CSP, including sandboxed srcdoc.
    sub_filter '__PROTOFLOW_FRAME_NONCE__' $request_id;
    location /api/v1/view/ {
        limit_req zone=preview_access burst=20 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location /api/v1/mcp/ {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
    location = /api/v1/updates {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/updates/ {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/admin/ {
        # Public HTTP admin access requires both this RFC1918 ACL and API ADMIN_HTTP_ALLOWED_CIDRS.
        # Host-local / SSH-tunnel admin access uses the dedicated 127.0.0.1-bound listener on port 8089.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=preview_access burst=20 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 35s;
    }
    location = /api/v1/releases {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        client_max_body_size 20m;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 300s;
    }
    location /api/v1/releases/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        client_max_body_size 512m;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP $remote_addr;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 35s;
    }
    location = /healthz { proxy_pass http://protoflow_api; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /p/ {
        expires -1;
        try_files /viewer.html =404;
    }
    location /releases {
        expires -1;
        try_files /viewer.html =404;
    }
    location /updates {
        expires -1;
        try_files /viewer.html =404;
    }
    location = / { try_files /viewer.html =404; }
    location / { try_files $uri =404; }
}

# Dedicated host-loopback / SSH-tunnel listener published strictly as 127.0.0.1:${ADMIN_PORT:-8089}:8089 in compose.yml.
# Never publish this port on 0.0.0.0, and never whitelist the Docker bridge gateway globally.
server {
    listen 8089;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    sub_filter '__PROTOFLOW_FRAME_NONCE__' $request_id;
    location /api/v1/view/ {
        limit_req zone=preview_access burst=20 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location /api/v1/mcp/ {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
    location = /api/v1/updates {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/updates/ {
        limit_req zone=preview_access burst=30 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/v1/admin/ {
        limit_req zone=preview_access burst=20 nodelay;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP 127.0.0.1;
        proxy_set_header X-Protoflow-Admin-Channel loopback;
        proxy_read_timeout 35s;
    }
    location = /api/v1/releases {
        client_max_body_size 20m;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP 127.0.0.1;
        proxy_set_header X-Protoflow-Admin-Channel loopback;
        proxy_read_timeout 300s;
    }
    location /api/v1/releases/ {
        client_max_body_size 512m;
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP 127.0.0.1;
        proxy_set_header X-Protoflow-Admin-Channel loopback;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://protoflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Protoflow-Client-IP 127.0.0.1;
        proxy_set_header X-Protoflow-Admin-Channel "";
        proxy_read_timeout 35s;
    }
    location = /healthz { proxy_pass http://protoflow_api; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /p/ {
        expires -1;
        try_files /viewer.html =404;
    }
    location /releases {
        expires -1;
        try_files /viewer.html =404;
    }
    location /updates {
        expires -1;
        try_files /viewer.html =404;
    }
    location = / { try_files /viewer.html =404; }
    location / { try_files $uri =404; }
}
