worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /srv/site/current;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Keep connect-src 'self' for self-hosted release-center deployments.
        # If config.js sets releaseSource: 'github', add https://api.github.com to connect-src.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;

        location ~ /\. {
            deny all;
        }

        # Only public discovery and downloads are shared with the release center.
        # Keep browser requests same-origin without exposing administrative APIs.
        location = /api/v1/updates {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8088;
            proxy_set_header Host $proxy_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/updates/assets/[A-Za-z0-9_-]+/download$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8088;
            proxy_set_header Host $proxy_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location /api/ { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
