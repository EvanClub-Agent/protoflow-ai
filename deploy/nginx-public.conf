# Example public HTTPS Nginx deployment for protoflow.example.com.
# Obtain a TLS certificate with Certbot before enabling SSL.
limit_req_zone $binary_remote_addr zone=protoflow_public:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name protoflow.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name protoflow.example.com;
    ssl_certificate /etc/letsencrypt/live/protoflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protoflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:protoflow_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /data/protoflow-ai/current/website;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    sub_filter '__PROTOFLOW_FRAME_NONCE__' $request_id;
    sub_filter_once off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Protoflow-Client-IP $remote_addr;
    proxy_set_header X-Protoflow-Admin-Channel "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;

    location /api/v1/view/ {
        limit_req zone=protoflow_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }
    location /api/v1/updates {
        limit_req zone=protoflow_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 300s;
    }
    # Gin registers the collection without a trailing slash. An exact location
    # prevents Nginx and Gin from redirecting back and forth between both forms.
    location = /api/v1/releases {
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 300s;
    }
    location /api/v1/releases/ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 300s;
    }
    location /api/ { proxy_pass http://127.0.0.1:8081; }
    location = /healthz { proxy_pass http://127.0.0.1:8081; }

    # The website and published viewer share one origin; hashed viewer bundles
    # and website brand assets remain in their respective release directories.
    location /assets/ {
        root /data/protoflow-ai/current;
        try_files /viewer$uri /website$uri =404;
        expires 1y;
    }
    location /p/ {
        root /data/protoflow-ai/current/viewer;
        expires -1;
        try_files /viewer.html =404;
    }
    location /releases {
        root /data/protoflow-ai/current/viewer;
        expires -1;
        try_files /viewer.html =404;
    }
    location /updates {
        root /data/protoflow-ai/current/viewer;
        expires -1;
        try_files /viewer.html =404;
    }
    location ~ /\. { deny all; }
    location / { expires -1; try_files $uri $uri/ =404; }
}
