services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protoflow_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-protoflow_publish}
    volumes:
      - protoflow_postgres:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-protoflow} -d $${POSTGRES_DB:-protoflow_publish}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  api:
    image: ${PROTOFLOW_API_IMAGE:-ghcr.io/evanclub-agent/protoflow-ai-api:latest}
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-protoflow}:${POSTGRES_PASSWORD:-protoflow_change_me}@postgres:5432/${POSTGRES_DB:-protoflow_publish}?sslmode=disable}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      LISTEN_ADDR: 0.0.0.0:8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RELEASE_STORAGE_DIR: /var/lib/protoflow/releases
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-web,127.0.0.1,::1}
      ADMIN_HTTP_ALLOWED_CIDRS: ${ADMIN_HTTP_ALLOWED_CIDRS:-}
    volumes:
      - protoflow_releases:/var/lib/protoflow/releases
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    image: ${PROTOFLOW_WEB_IMAGE:-ghcr.io/evanclub-agent/protoflow-ai-web:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
      - "127.0.0.1:${ADMIN_PORT:-8089}:8089"

volumes:
  protoflow_postgres:
  protoflow_releases:
